<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" 
      content="default-src * qrc: 'unsafe-inline' 'unsafe-eval' data: blob:;
               connect-src * 'unsafe-inline' 'unsafe-eval' data: blob:;
               script-src * qrc: 'unsafe-inline' 'unsafe-eval' blob:;
               style-src * 'unsafe-inline';
               img-src * data: blob:;
               font-src * data:;
               frame-src *;
               media-src *;" />
    <!-- Qt WebChannel Integration -->
    <script src="%PUBLIC_URL%/qwebchannel.js"></script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="SEED-IT Learning Platform"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/SEED_Logo.png" />
    <title>SEED-IT</title>
    <!-- Structured Data for SEO -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "SEED Institute of Training",
      "alternateName": "SEED IT",
      "url": "https://seedit.tech",
      "logo": {
        "@type": "ImageObject",
        "url": "https://i.ibb.co/xq80RrBW/SEED-Logo.webp"
      },
      "description": "SEED IT (Skill-Enhancement & Employability Development Institute of Training) is a leading Training and Placement company managed by IT veterans with more than a decade of experience in leading MNC companies.",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "CHIL SEZ IT Park (Special Economic Zone)",
        "addressLocality": "Saravanampatti, Coimbatore",
        "addressRegion": "Tamil Nadu",
        "postalCode": "641035",
        "addressCountry": "IN"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+91-94427 30135",
        "contactType": "customer service",
        "email": "seed.skillup@gmail.com"
      },
      "sameAs": [
        "https://facebook.com/seedit",
        "https://linkedin.com/company/seedit",
        "https://instagram.com/seed_skillup",
        "https://twitter.com/seedit"
      ],
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": 4.8,
        "reviewCount": 8000,
        "bestRating": 5,
        "worstRating": 1
      },
      "numberOfEmployees": {
        "@type": "QuantitativeValue",
        "value": 100
      },
     
   
      "hasCredential": [
        {
          "@type": "EducationalOccupationalCredential",
          "name": "ISO Certification",
          "credentialCategory": "Professional Certification"
        },
        {
          "@type": "EducationalOccupationalCredential",
          "name": "ISTQB Certification",
          "credentialCategory": "Professional Certification"
        },
        {
          "@type": "EducationalOccupationalCredential",
          "name": "Microsoft Certification",
          "credentialCategory": "Professional Certification"
        }
      ]
    }
    </script>
    <!-- PyQt detection script -->
    <script>
      // This will be set to true by PyQt if it's running in that environment
      window.pyqtFlag = false;
      
      // Function that PyQt can call to indicate the app is ready
      window.pyqtAppReady = function() {
        window.pyqtFlag = true;
        console.log('PyQt environment detected and ready');
        return true;
      };
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
